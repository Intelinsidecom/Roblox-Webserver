<div><div class=notification-image-container><div class="avatar avatar-headshot-sm card-plain" ng-if="privateMessageLayout.displayUserId!==null"><a ng-href={{library.userLibrary[privateMessageLayout.displayUserId].profileLink}}><img ng-src={{library.userLibrary[privateMessageLayout.displayUserId].thumbnail.Url}} class=avatar-card-image title={{privateMessageLayout.displayUserName}}></a></div><span class=icon-nav-group ng-if="privateMessageLayout.displayUserId===null"></span></div><div class=notificaiton-item-content><div class=notification-data-container><span class="small notification-display-text" ng-show=!privateMessageLayout.isStacked><div class="small message-header">Message from <span class=font-bold>{{privateMessageLayout.displayUserName}}</span>:</div><div class="small message-preview">{{privateMessageLayout.messagePreview}}</div></span><div class="small notification-display-text" ng-show=privateMessageLayout.isStacked>You received <span class=font-bold><ng-pluralize count=notification.eventCount when="{'one':'1 ','other':'{} '}"> </ng-pluralize></span> <ng-pluralize count=notification.eventCount when="{'one':'message.','other':'messages.'}"> </ng-pluralize></div><div class=text-date-hint>{{notification.eventDate|parseTimeStamp|date:"MMM d, yyyy | h:mm a"}}</div></div></div></div>
