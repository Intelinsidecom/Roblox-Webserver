<div class=modal-header><button type=button class=close ng-click=dismiss()><span aria-hidden=true><span class=icon-close></span></span><span class=sr-only>Close</span></button><h4 ng-bind="passwordSetSuccess?'Success':title"></h4></div><div class=modal-body><form class=form-horizontal ng-show=!passwordSetSuccess role=form name=changePasswordForm ng-submit=submit(changePasswordForm)><div class=form-group ng-show=facebookDisconnect><p>Please add password to secure your account before disconnecting from Facebook.</div><div class=form-group ng-show=changePassword><input id=old-password-text-box name=passwordInfo.oldPassword class="form-control input-field" placeholder="Current Password" type=password rbx-valid-password ng-model=passwordInfo.oldPassword ng-trim=false ng-required=changePassword?true:false></div><div class=form-group><input id=new-password-text-box name=passwordInfo.newPassword class="form-control input-field" placeholder="New Password" type=password rbx-valid-password ng-model=passwordInfo.newPassword ng-trim=false ng-required=true></div><div class=form-group><input id=confirm-password-text-box name=passwordInfo.confirmPassword class="form-control input-field" placeholder="Confirm Password" type=password rbx-valid-password-confirm match-field=passwordInfo.newPassword ng-model=passwordInfo.confirmPassword ng-trim=false ng-required=true><p class="form-control-label modal-error-message"><span ng-bind=passwordErrorMessage(changePasswordForm)></span></div></form><div ng-if=passwordSetSuccess>You have successfully changed your password.</div></div><div class=modal-buttons><button type=submit ng-show=!passwordSetSuccess class="modal-button btn-secondary-md" ng-click=submit(changePasswordForm) ng-disabled=changePasswordForm.$invalid>Update</button> <button ng-if=passwordSetSuccess class="modal-button btn-control-md" ng-click=$close(true)>OK</button></div>
