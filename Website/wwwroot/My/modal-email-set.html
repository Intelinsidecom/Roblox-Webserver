<div class=modal-header><button type=button class=close ng-click=dismiss()><span aria-hidden=true><span class=icon-close></span></span><span class=sr-only>Close</span></button><h4 ng-bind=title()></h4></div><div class=modal-body><div class=two-step-warning ng-show=!addEmail&amp;&amp;!emailSetSuccess&amp;&amp;!emailRequired><span class=icon-warning-orange></span> <span class="small text-warning form-warning-text">The account email will not change until the new email has been verified.</span></div><div ng-if=emailRequired ng-bind="'You must provide and verify your email before you can '+action+'.'"></div><form class=form-horizontal ng-show=!emailSetSuccess&amp;&amp;!emailRequired autocomplete=off role=form name=updateEmailForm ng-submit=submit(updateEmailForm)><div class=form-group><input id=emailAddress name=userInfo.emailAddress type=email class="form-control input-field" placeholder={{title()}} autocomplete=off ng-pattern=regexData.email ng-model=userInfo.emailAddress ng-required=true></div><input type=text class=hidden> <input type=password class=hidden><div class=form-group><input id=password name=userInfo.password class="form-control input-field" placeholder="Verify Account Password" type=password autocomplete=new-password ng-model=userInfo.password ng-required=true><p class="form-control-label modal-error-message"><span ng-bind=emailErrorMessage(updateEmailForm)></span></div></form><div ng-if=emailSetSuccess>An email has been sent for verification.</div></div><div class=modal-buttons><button type=submit ng-show=!emailSetSuccess&amp;&amp;!emailRequired id=purchaseConfirm class="modal-button btn-secondary-md" ng-click=submit(updateEmailForm) ng-disabled=updateEmailForm.$invalid ng-bind=submitButtonText()></button> <button ng-if=emailSetSuccess type=button class="modal-button btn-control-md" ng-click=$close(true) ng-bind=modalConstants.default.submitButtonText></button> <button ng-show=emailRequired type=submit class="modal-button btn-secondary-md" ng-click="email
