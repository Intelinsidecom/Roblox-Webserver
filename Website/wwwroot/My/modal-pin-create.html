<div class=modal-header><button type=button class=close ng-click=dismiss()><span aria-hidden=true><span class=icon-close></span></span><span class=sr-only>Close</span></button><h4 ng-bind="pinCreateSuccess?'Success':'Add PIN'"></h4></div><div class=modal-body id=modal-body><form role=form ng-show=!pinCreateSuccess name=pinCreateForm ng-submit=submit(pinCreateForm)><div class="text-label pin-fields-email">Verified email: <span ng-bind=userEmail></span></div><div class=pin-fields><div class=pin-fields-label>Create a <span ng-bind=accountPinLength></span>-digit PIN</div><input type=tel class="form-control pin-field" name=newPin autocomplete=off ng-trim=false ng-model=pinInfo.newPin minlength={{accountPinLength}} maxlength={{accountPinLength}} ng-minlength={{accountPinLength}} ng-maxlength={{accountPinLength}} ng-required=true numbers-only autofocus><div class=pin-fields-label>Confirm your PIN</div><input type=tel class="form-control pin-field" name=newPinConfirm autocomplete=off ng-trim=false ng-model=pinInfo.newPinConfirm minlength={{accountPinLength}} maxlength={{accountPinLength}} ng-minlength={{accountPinLength}} ng-maxlength={{accountPinLength}} ng-required=true numbers-only match-field=pinInfo.newPin></div><div class="pin-fields-error text-center text-error"><span ng-bind=pinErrorMessage(pinCreateForm)></span> <span ng-if=!pinErrorMessage(pinCreateForm)>&nbsp;</span></div><input type=submit class=hidden ng-disabled=pinCreateForm.$invalid></form><div ng-if=pinCreateSuccess>Your PIN is now set. You will need to enter this PIN before accessing the Settings page in the future.</div></div><div class=modal-buttons><button type=submit class="modal-button btn-secondary-md" ng-show=!pinCreateSuccess ng-click=submit(pinCreateForm) ng-disabled=pinCreateForm.$invalid>Add</button> <button ng-if=pinCreateSuccess class="modal-button btn-control-md" ng-click=$close(true)>OK</button></div>
