<div class=modal-header><button type=button class=close ng-click=dismiss()><span aria-hidden=true><span class=icon-close></span></span><span class=sr-only>Close</span></button><h4 ng-bind="usernameUpdateSuccess?'Success':'Change Username'"></h4></div><div class=modal-body><div class=change-username-price ng-show=!usernameUpdateSuccess>Change username for <span class=icon-robux-16x16></span> <span class=text-robux>1,000</span>?</div><div class=small ng-show=!usernameUpdateSuccess>&nbsp;</div><form class=form-horizontal ng-show=!usernameUpdateSuccess role=form name=changeUsernameForm ng-submit=submit(changeUsernameForm)><div class=form-group><input id=desired-username-text-box name=username class="form-control input-field" placeholder="Desired Username (3-20 characters)" autocomplete=off ng-model=user.username ng-blur=onChange() ng-keyup=onChange() ng-change=onChange() account-valid-username required><p class="form-control-label modal-error-message"><span ng-show=changeUsernameForm.username.$dirty&amp;&amp;!changeUsernameForm.username.$valid ng-bind=changeUsernameForm.username.$usernameMessage></span></div><div class=form-group><input id=account-password-text-box name=password class="form-control input-field" placeholder="Account Password" type=password autocomplete=off ng-model=user.password required><p class="form-control-label modal-error-message" id=generic-error-message><span ng-bind=usernameErrorMessage(changeUsernameForm)></span></div></form><div ng-if=usernameUpdateSuccess ng-bind="result.message?result.message:'Successfully changed username.'"></div><div ng-show=!usernameUpdateSuccess><strong>Important:</strong> Original account creation date and forum post count will carry over to your new username.</div><div ng-show=!usernameUpdateSuccess>Previous forum posts will appear under your old username and will NOT carry over to your new username.</div></div><div class=modal-buttons><div ng-if=!usernameUpdateSuccess><button type=submit class="modal-button btn-primary-md" ng-click=submit(changeUsernameForm) ng-disabled=changeUsernameForm.$invalid>Buy</button></div><div class=text-center ng-if=usernameUpdateSuccess><button type=submit class="modal-button btn-control-md" ng-click=$close(true)>OK</button></div></div>
