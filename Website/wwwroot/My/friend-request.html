<div><div class=notification-item-front><div class=notification-image-container><div class="avatar avatar-headshot-sm card-plain" ng-if="userIds.length>=1"><a href={{library.userLibrary[userIds[0]].profileLink}} type=goToProfilePage user_id={{userIds[0]}} click-in-card><img ng-src={{library.userLibrary[userIds[0]].thumbnail.Url}} class=avatar-card-image href={{library.userLibrary[userIds[0]].profileLink}} type=goToProfilePage user_id={{userIds[0]}} title={{library.userLibrary[userIds[0]].name}}></a></div><span class="icon-nav-group notification-image-placeholder" ng-if="!userIds||userIds.length==0"></span></div><div class=notificaiton-item-content><div class=notification-data-container><span class="small notification-display-text" click-in-card ng-hide=notification.metadataCollection[0].IsAccepted ng-bind-html=notificationDisplayText></span> <span class="small notification-display-text" click-in-card ng-show=notification.metadataCollection[0].IsAccepted ng-bind-html=requestConfirmedText></span><div class=text-date-hint>{{notification.eventDate|parseTimeStamp|date:"MMM d, yyyy | h:mm a"}}</div></div><div class=notification-action-container><button class=btn-secondary-xs id=accept-fr-btn ng-show="notification.friendRequestActionType===friendRequestActionType.acceptIgnoreBtns" ng-click=acceptFriend({friendRequestId:userIds[0],notificationId:notification.id,event:$event})>Accept</button> <button class=btn-control-xs id=ignore-fr-btn ng-show="notification.friendRequestActionType===friendRequestActionType.acceptIgnoreBtns" ng-click=ignoreFriend({friendRequestId:userIds[0],notificationId:notification.id,event:$event})>Ignore</button> <button class="roblox-popover-close btn-control-xs" id=chat-btn ng-class="{'btn-full-width':library.isPhone}" ng-show="notification.friendRequestActionType===friendRequestActionType.chatBtn&amp;&amp;!library.isChatDisabledByPrivacySetting" ng-click=chat({friendId:userIds[0],notificationId:notification.id,event:$event})>Chat</button> <a class=btn-secondary-xs id=view-all-btn ng-class="{'btn-full-width':library.isPhone}" ng-show="notification.friendRequestActionType===friendRequestActionType.viewAllBtn" click-in-card type=viewAllFriendRequests ng-href={{friendRequestLink}}>View All</a></div></div></div><div class=notification-item-back><div class=notification-image-container><div class="avatar avatar-headshot-sm card-plain" ng-if="userIds.length>=1"><span ng-href={{library.userLibrary[userIds[0]].profileLink}} href={{library.userLibrary[userIds[0]].profileLink}} type=goToProfilePage user_id={{userIds[0]}} click-in-card><img ng-src={{library.userLibrary[userIds[0]].thumbnail.Url}} ng-href={{library.userLibrary[userIds[0]].profileLink}} href={{library.userLibrary[userIds[0]].profileLink}} type=goToProfilePage user_id={{userIds[0]}} class=avatar-card-image></span></div><span class="icon-nav-group notification-image-placeholder" ng-if="!userIds||userIds.length==0"></span></div><div class=notificaiton-item-content><div class="notification-data-container small"><span class=notification-display-text click-in-card ng-show=notification.metadataCollection[0].IsAccepted ng-bind-html=requestConfirmedText></span><div class=text-date-hint>{{notification.eventDate|parseTimeStamp|date:"MMM d, yyyy | h:mm a"}}</div></div><div class=notification-action-container ng-show="notification.notificationSourceType==notificationSourceType.friendRequestReceived"><button class=btn-control-xs id=chat-btn ng-class="{'btn-full-width':library.isPhone}" ng-show="notification.friendRequestActionType==friendRequestActionType.chatBtn&amp;&amp;!library.isChatDisabledByPrivacySetting" ng-click=chat({friendId:userIds[0],notificationId:notification.id,event:$event})>Chat</button></div></div></div></div>
